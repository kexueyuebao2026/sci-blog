<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签：{{ .Title }}</title>
{{ with resources.Get "css/main.css" }}
<link rel="stylesheet" href="{{ .RelPermalink }}">
{{ end }}
<style>
body {
  background-color: #edf4fc;
  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1rem;
}
ul {
  list-style: none;
  padding-left: 0;
}
li {
  background: #ffffff;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 10px;
}
a {
  color: #222;
  text-decoration: none;
}
small {
  color: #666;
  margin-left: 8px;
}
</style>
</head>
<body>
<h1>标签：{{ .Title }}</h1>
<ul>
{{ range .Pages }}
<li>
  <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  <small>{{ .Date.Format "2006-01-02" }}</small>
</li>
{{ end }}
</ul>
<p><a href="/tags/">查看全部标签</a> | <a href="/">← 返回首页</a></p>
</body>
</html>
