<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{ .Title }}</title>
{{ with resources.Get "css/main.css" }}
<link rel="stylesheet" href="{{ .RelPermalink }}">
{{ end }}
</head>
<body>
<h1>{{ .Title }}</h1>
<ul>
{{ range .Pages }}
<li>
  <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  <small>{{ .Date.Format "2006-01-02" }}</small>
</li>
{{ end }}
</ul>
<p><a href="/">← 返回首页</a></p>
</body>
</html>
